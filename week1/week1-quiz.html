/* ---------------------------------------------------------------
   Helpers
---------------------------------------------------------------- */
const TIERS = ["All", "Easy", "Medium", "Hard"];

function normalise(s) {
  return String(s)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");
}

function isCorrect(q, typed) {
  const t = normalise(typed);
  if (t === "") return false;
  const accepted = [q.a].concat(q.alt || []).map(normalise);
  return accepted.indexOf(t) !== -1;
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

const $ = function (id) { return document.getElementById(id); };

/* ---------------------------------------------------------------
   State
---------------------------------------------------------------- */
let currentTier = "All";
let order = [];       // array of question objects for this run
let pos = 0;
let answered = false;
let hintUsed = false;
let results = {};     // id -> { ok: boolean, hint: boolean }

/* ---------------------------------------------------------------
   Tabs
---------------------------------------------------------------- */
function buildTabs() {
  const box = $("tabs");
  box.innerHTML = "";
  TIERS.forEach(function (t) {
    const count = t === "All" ? QUESTIONS.length : QUESTIONS.filter(function (q) { return q.tier === t; }).length;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t + " (" + count + ")";
    b.setAttribute("aria-pressed", String(t === currentTier));
    b.addEventListener("click", function () { startRun(t, null); });
    box.appendChild(b);
  });
}

/* ---------------------------------------------------------------
   Run control
---------------------------------------------------------------- */
function startRun(tier, onlyIds) {
  currentTier = tier;
  let list = QUESTIONS.filter(function (q) { return tier === "All" || q.tier === tier; });
  if (onlyIds) list = list.filter(function (q) { return onlyIds.indexOf(q.id) !== -1; });
  if ($("shuffle").checked) list = shuffleArray(list);
  order = list;
  pos = 0;
  results = {};
  buildTabs();
  $("summary").hidden = true;
  $("quizArea").hidden = false;
  renderQuestion();
}

function renderQuestion() {
  if (pos >= order.length) { showSummary(); return; }
  const q = order[pos];
  answered = false;
  hintUsed = false;

  $("tierBadge").textContent = q.tier;
  $("qText").textContent = q.q;
  $("qSource").innerHTML = "";
  const lab = document.createElement("b");
  lab.textContent = "Source: ";
  $("qSource").appendChild(lab);
  $("qSource").appendChild(document.createTextNode(q.source));

  const input = $("answer");
  input.value = "";
  input.disabled = false;
  $("hintText").textContent = "";
  $("feedback").className = "feedback";
  $("mainBtn").textContent = "Check answer";
  $("hintBtn").disabled = false;
  $("giveBtn").disabled = false;
  updateProgress();
  input.focus();
}

function updateProgress() {
  const done = Object.keys(results).length;
  const right = Object.keys(results).filter(function (k) { return results[k].ok; }).length;
  $("progText").textContent = "Question " + Math.min(pos + 1, order.length) + " of " + order.length;
  $("scoreText").textContent = "Correct so far: " + right + " / " + done;
  $("barFill").style.width = (order.length ? (pos / order.length) * 100 : 0) + "%";
}

function reveal(q, ok, typed, gaveUp) {
  answered = true;
  results[q.id] = { ok: ok, hint: hintUsed };
  $("answer").disabled = true;
  $("hintBtn").disabled = true;
  $("giveBtn").disabled = true;
  $("mainBtn").textContent = pos + 1 >= order.length ? "See results" : "Next question";

  const fb = $("feedback");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  if (ok) {
    $("verdict").textContent = hintUsed ? "Correct (with a hint)." : "Correct.";
  } else if (gaveUp) {
    $("verdict").textContent = "Answer revealed. Write it out by hand once:";
  } else {
    $("verdict").textContent = "Not quite. You typed: " + typed + ". The answer is:";
  }
  $("correctAns").textContent = q.a;
  $("noteText").textContent = q.note || "";
  updateProgress();
  $("mainBtn").focus();
}

function check() {
  const q = order[pos];
  const typed = $("answer").value;
  if (typed.trim() === "") {
    $("hintText").textContent = "Type something first, or press Show answer.";
    $("answer").focus();
    return;
  }
  reveal(q, isCorrect(q, typed), typed.trim(), false);
}

function giveUp() {
  reveal(order[pos], false, "", true);
}

function showHint() {
  const q = order[pos];
  hintUsed = true;
  const len = normalise(q.a).length;
  $("hintText").textContent = "Starts with \"" + q.a.charAt(0).toUpperCase() + "\" and has " + len + " letters.";
  $("answer").focus();
}

function next() {
  pos += 1;
  renderQuestion();
}

/* ---------------------------------------------------------------
   Summary
---------------------------------------------------------------- */
function showSummary() {
  $("quizArea").hidden = true;
  const box = $("summary");
  box.hidden = false;
  box.innerHTML = "";

  const total = order.length;
  const right = order.filter(function (q) { return results[q.id] && results[q.id].ok; }).length;
  const hints = order.filter(function (q) { return results[q.id] && results[q.id].hint; }).length;
  const missed = order.filter(function (q) { return !(results[q.id] && results[q.id].ok); });

  const h = document.createElement("h2");
  h.textContent = "Run complete: " + currentTier;
  box.appendChild(h);

  const sc = document.createElement("p");
  sc.className = "score";
  sc.textContent = right + " / " + total;
  box.appendChild(sc);

  const meta = document.createElement("p");
  meta.textContent = "Hints used: " + hints + ". Missed: " + missed.length + ".";
  box.appendChild(meta);

  /* per-tier table */
  const table = document.createElement("table");
  table.innerHTML = "<tr><th>Tier</th><th>Correct</th></tr>";
  ["Easy", "Medium", "Hard"].forEach(function (t) {
    const inTier = order.filter(function (q) { return q.tier === t; });
    if (!inTier.length) return;
    const r = inTier.filter(function (q) { return results[q.id] && results[q.id].ok; }).length;
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + t + "</td><td>" + r + " / " + inTier.length + "</td>";
    table.appendChild(tr);
  });
  box.appendChild(table);

  if (missed.length) {
    const mh = document.createElement("p");
    mh.innerHTML = "<b>Write these out by hand:</b>";
    box.appendChild(mh);
    const ul = document.createElement("ul");
    ul.className = "missed";
    missed.forEach(function (q) {
      const li = document.createElement("li");
      const qd = document.createElement("div");
      qd.textContent = q.q;
      const ad = document.createElement("div");
      ad.className = "ma";
      ad.textContent = q.a;
      const sd = document.createElement("div");
      sd.className = "ms";
      sd.textContent = "Source: " + q.source;
      li.appendChild(qd); li.appendChild(ad); li.appendChild(sd);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  } else {
    const p = document.createElement("p");
    p.textContent = "Clean sweep. Try Hard tier with shuffle switched on.";
    box.appendChild(p);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  if (missed.length) {
    const rb = document.createElement("button");
    rb.type = "button"; rb.className = "btn primary";
    rb.textContent = "Retry missed (" + missed.length + ")";
    const ids = missed.map(function (q) { return q.id; });
    rb.addEventListener("click", function () { startRun(currentTier, ids); });
    actions.appendChild(rb);
  }
  const again = document.createElement("button");
  again.type = "button"; again.className = "btn";
  again.textContent = "Restart " + currentTier;
  again.addEventListener("click", function () { startRun(currentTier, null); });
  actions.appendChild(again);
  box.appendChild(actions);

  $("barFill").style.width = "100%";
  box.scrollIntoView({ behavior: "auto", block: "start" });
}

/* ---------------------------------------------------------------
   Wiring
---------------------------------------------------------------- */
$("mainBtn").addEventListener("click", function () {
  if (answered) next(); else check();
});
$("hintBtn").addEventListener("click", showHint);
$("giveBtn").addEventListener("click", giveUp);
$("answer").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    if (answered) next(); else check();
  }
});

startRun("All", null);
</script>
</body>
</html>
